[package]
name = "owlivion-core"
version = "1.0.0"
description = "Owlivion Mail - Platform-agnostic core library"
authors = ["Berkan Cetinel <babafpv@gmail.com>"]
edition = "2021"

[lib]
name = "owlivion_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"

[dependencies]
# UniFFI for cross-platform bindings
uniffi = { version = "0.28", features = ["tokio", "cli"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mail dependencies
imap = { version = "2.4", default-features = false }
async-imap = "0.11.1"
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "hostname", "pool", "smtp-transport", "tokio1"] }

# TLS (rustls - Android/iOS compatible)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
mail-parser = "0.9"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2.5"
quick-xml = "0.31"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Cache
moka = { version = "0.12", features = ["future"] }

# Additional utilities
thiserror = "1.0"
regex-lite = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
log = "0.4"
dirs = "5.0"
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4"] }
mime = "0.3"
directories = "5.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# DNS resolver for MX lookup
hickory-resolver = "0.24"

# Crypto for password encryption
ring = "0.17"
hostname = "0.4"
zeroize = { version = "1.7", features = ["derive"] }
lazy_static = "1.4"
hex = "0.4"
sha2 = "0.10"

# Compression for sync
flate2 = "1.0"

# OAuth2 authentication
oauth2 = "4.4"
urlencoding = "2.1"

# Desktop-only dependencies (OAuth callback server)
tiny_http = { version = "0.12", optional = true }
open = { version = "5.0", optional = true }

# Android logging
android_logger = { version = "0.14", optional = true }

[features]
default = []
desktop = ["tiny_http", "open"]
android = ["android_logger"]

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
mockito = "1.2"
tempfile = "3.8"
